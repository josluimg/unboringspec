[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unboringspec"
version = "0.1.0"
description = "Specs your brain actually wants to review. A human review experience for Spec-Driven Development."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["sdd", "spec-driven-development", "spec-kit", "code-review", "llm", "developer-experience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "rich>=13",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
unboring = "unboringspec.cli:app"
unboringspec = "unboringspec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/unboringspec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
