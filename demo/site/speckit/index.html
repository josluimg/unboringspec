<script>
(() => {
  const KEY = "unboring-theme", root = document.documentElement, sys = matchMedia("(prefers-color-scheme: dark)");
  let choice = null;
  try { choice = localStorage.getItem(KEY); } catch (e) {}
  const apply = () => { root.dataset.theme = choice || (sys.matches ? "dark" : "light"); };
  apply();
  sys.addEventListener("change", () => { if (!choice) apply(); });
  window.unboringToggleTheme = () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    choice = next === (sys.matches ? "dark" : "light") ? null : next;  // back to the system's: follow it again
    try { choice ? localStorage.setItem(KEY, choice) : localStorage.removeItem(KEY); } catch (e) {}
    apply();
  };
})();

<script id="data" type="application/json">{"slug": "speckit", "framework": "spec-kit", "feature": "Álbumes de fotos compartidos", "files": {"specs/001-albumes-compartidos/spec.md": "# Especificación de la funcionalidad: Álbumes de fotos compartidos\n\n**Rama de la funcionalidad**: `001-albumes-compartidos`\n**Creada**: 2026-11-20\n**Estado**: Borrador\n**Entrada**: Descripción del usuario: \"Que las familias creen álbumes de fotos compartidos, inviten a sus parientes con un enlace y reciban un resumen semanal de las fotos nuevas.\"\n\n## Escenarios de usuario y pruebas *(obligatorio)*\n\n### Historia de usuario 1 - Crear un álbum y subir fotos (Prioridad: P1)\n\nUn usuario crea un álbum, le pone nombre y sube fotos desde el móvil o el ordenador.\n\n**Por qué esta prioridad**: Sin álbumes ni subidas no hay producto.\n\n**Prueba independiente**: Crear un álbum, subir 10 fotos y verlas en una cuadrícula ordenadas por fecha de captura.\n\n**Escenarios de aceptación**:\n\n1. **Dado** un usuario con sesión iniciada, **cuando** crea un álbum llamado \"Verano 2026\", **entonces** aparece en su lista de álbumes.\n2. **Dado** un álbum, **cuando** el usuario sube 10 fotos JPEG, **entonces** aparecen las 10 ordenadas por fecha EXIF.\n\n---\n\n### Historia de usuario 2 - Invitar a los parientes con un enlace (Prioridad: P1)\n\nEl dueño del álbum comparte un enlace de invitación. Cualquiera que tenga el enlace puede ver y añadir fotos.\n\n**Por qué esta prioridad**: Compartir es la propuesta de valor principal.\n\n**Prueba independiente**: Abrir el enlace de invitación en una ventana privada, unirse y subir una foto.\n\n---\n\n### Historia de usuario 3 - Correo con el resumen semanal (Prioridad: P2)\n\nLos miembros reciben cada semana un correo con miniaturas de las fotos nuevas de sus álbumes.\n\n**Por qué esta prioridad**: Hace que la gente vuelva, pero el producto funciona sin él.\n\n---\n\n### Casos límite\n\n- ¿Qué pasa si un enlace de invitación se filtra públicamente? [NEEDS CLARIFICATION: ¿los enlaces deben caducar o poder revocarse?]\n- ¿Cómo se gestionan las subidas duplicadas de la misma foto?\n- ¿Qué pasa con las fotos de un miembro cuando abandona el álbum? [NEEDS CLARIFICATION: ¿sus fotos se quedan o se eliminan?]\n\n## Requisitos *(obligatorio)*\n\n### Requisitos funcionales\n\n- **FR-001**: El sistema DEBE permitir a los usuarios con sesión iniciada crear álbumes con un nombre de hasta 80 caracteres.\n- **FR-002**: El sistema DEBE aceptar subidas JPEG, PNG y HEIC de hasta 25 MB cada una.\n- **FR-003**: El sistema DEBE generar un enlace de invitación único por álbum.\n- **FR-004**: Cualquiera con un enlace de invitación DEBE poder ver y subir fotos a ese álbum.\n- **FR-005**: El sistema DEBE enviar un correo con el resumen semanal cada lunes a las 08:00 en la zona horaria del miembro.\n- **FR-006**: El sistema DEBE eliminar la ubicación GPS de los metadatos EXIF antes de que otros miembros vean las fotos.\n- **FR-007**: El sistema DEBE conservar los archivos originales durante [NEEDS CLARIFICATION: no se ha definido el plazo de conservación].\n\n### Entidades clave\n\n- **Álbum**: nombre, dueño, token de invitación, fecha de creación.\n- **Foto**: archivo, álbum, quien la sube, fecha de captura, fecha de subida.\n- **Membresía**: usuario, álbum, rol (dueño, miembro), fecha de alta.\n\n## Criterios de éxito *(obligatorio)*\n\n- **SC-001**: El 80 % de los álbumes nuevos recibe al menos un miembro invitado en 7 días.\n- **SC-002**: Subir 10 fotos tarda menos de 30 segundos con una conexión de 20 Mbps.\n", "specs/001-albumes-compartidos/plan.md": "# Plan de implementación: Álbumes de fotos compartidos\n\n**Rama**: `001-albumes-compartidos` | **Fecha**: 2026-11-21 | **Spec**: [spec.md](./spec.md)\n\n## Resumen\n\nAplicación web con una API REST. Las fotos van del navegador directamente al almacenamiento de objetos con URL prefirmadas;\nun proceso en segundo plano genera miniaturas, elimina los datos GPS y envía el resumen semanal.\n\n## Contexto técnico\n\n**Lenguaje/Versión**: Python 3.12 (API, proceso en segundo plano), TypeScript 5 (web)\n**Dependencias principales**: FastAPI, SQLAlchemy, Celery, React 19\n**Almacenamiento**: PostgreSQL 16 para los metadatos, almacenamiento de objetos compatible con S3 para los archivos\n**Pruebas**: pytest, Playwright\n**Plataforma objetivo**: contenedores Linux en Kubernetes\n**Tipo de proyecto**: web\n**Objetivos de rendimiento**: 10 fotos subidas en menos de 30 s con 20 Mbps\n**Restricciones**: [NEEDS CLARIFICATION: presupuesto mensual de almacenamiento por familia]\n**Escala/Alcance**: 5.000 familias el primer año\n\n## Comprobación de la constitución\n\n- Primero las bibliotecas: las miniaturas y el EXIF viven en `photos_core`, independiente de la API. CUMPLE\n- Primero las pruebas: pruebas de contrato antes que los endpoints. CUMPLE\n\n## Estructura del proyecto\n\n```text\nbackend/\n  src/api/  src/worker/  src/photos_core/\n  tests/contract/  tests/integration/\nfrontend/\n  src/pages/  src/components/\n```\n", "specs/001-albumes-compartidos/research.md": "# Investigación: Álbumes de fotos compartidos\n\n## Ruta de subida\n\n- **Decisión**: El navegador sube directamente al almacenamiento de objetos con URL prefirmadas.\n- **Justificación**: Evita que los archivos de 25 MB pasen por los servidores de la API y cumple el objetivo de subida de 30 s.\n- **Alternativas consideradas**: Subir a través de la API; subidas reanudables con tus\n\n## Modelo de invitación\n\n- **Decisión**: Un único token de invitación permanente por álbum; quien tenga el enlace es miembro.\n- **Justificación**: La menor fricción posible para familiares poco técnicos.\n- **Alternativas consideradas**: Invitaciones personales por correo; enlaces que caducan; enlaces de solo lectura con aprobación para subir\n\n## Soporte de HEIC\n\n- **Decisión**: Convertir HEIC a JPEG en el proceso en segundo plano y conservar el original.\n- **Justificación**: La mayoría de los navegadores no muestra HEIC.\n- **Alternativas consideradas**: Rechazar HEIC; convertir en el navegador\n\n## Envío del resumen\n\n- **Decisión**: Una tarea de Celery beat cada hora que envía el resumen a los miembros cuya hora local sea el lunes a las 08:00.\n- **Justificación**: Respeta las zonas horarias sin una tarea por usuario.\n- **Alternativas consideradas**: Una tarea programada por usuario; enviar a todos a las 08:00 UTC\n", "specs/001-albumes-compartidos/tasks.md": "# Tareas: Álbumes de fotos compartidos\n\n## Fase 1: Preparación\n\n- [x] T001 Crear la estructura de backend y frontend según plan.md\n- [x] T002 [P] Configurar ruff, mypy y eslint\n- [ ] T003 [P] Preparar PostgreSQL y el almacenamiento de objetos en docker-compose\n\n## Fase 2: Base\n\n- [ ] T004 Crear los modelos Álbum, Foto y Membresía en backend/src/api/models.py\n- [ ] T005 [P] Implementar la lectura de EXIF y el borrado de GPS en backend/src/photos_core/exif.py\n- [ ] T006 [P] Implementar la generación de miniaturas en backend/src/photos_core/thumbs.py\n\n## Fase 3: Historia de usuario 1 - Crear un álbum y subir fotos (P1)\n\n- [ ] T007 [US1] Prueba de contrato de POST /albums en backend/tests/contract/test_albums.py\n- [ ] T008 [US1] Implementar POST /albums y GET /albums\n- [ ] T009 [P] [US1] Implementar el endpoint de URL de subida prefirmada\n- [ ] T010 [US1] Tarea en segundo plano: miniatura, conversión de HEIC y borrado de GPS al subir\n- [ ] T011 [P] [US1] Página de cuadrícula del álbum ordenada por fecha de captura en frontend/src/pages/Album.tsx\n\n## Fase 4: Historia de usuario 2 - Invitar a los parientes con un enlace (P1)\n\n- [ ] T012 [US2] Generar el token de invitación al crear el álbum\n- [ ] T013 [US2] Endpoint para unirse al álbum con el enlace de invitación\n- [ ] T014 [P] [US2] Página para unirse en frontend/src/pages/Join.tsx\n\n## Fase 5: Historia de usuario 3 - Correo con el resumen semanal (P2)\n\n- [ ] T015 [US3] Tarea horaria de Celery beat que selecciona a los miembros en <script>
(() => {
  const data = JSON.parse(document.getElementById("data").textContent);
  const paths = Object.keys(data.files);
  const folder = paths[0].split("/").slice(0, -1).join("/");
  const short = p => p.slice(folder.length + 1);

  document.getElementById("title").innerHTML = "";

  const lines = paths.reduce((n, p) => n + lineCount(data.files[p]), 0);
  const words = paths.reduce((n, p) => n + data.files[p].split(/\s+/).filter(Boolean).length, 0);
  document.getElementById("stats").innerHTML =
    data.ui.stats.replace("{files}", paths.length).replace("{lines}", lines).replace("{words}", words.toLocaleString(data.lang));

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const paint = line => {

    h = h.replace(/\[NEEDS CLARIFICATION[^\]]*\]/g, m => `<span class="md-m">${m}</span>`);
    h = h.replace(/\*\*([^*]+)\*\*/g, '<span class="md-b">**$1**</span>');
    h = h.replace(/`([^`]+)`/g, '<span class="md-c">`$1`</span>');
    return h;

  const tree = document.getElementById("tree"), tabs = document.getElementById("tabs");

  const open = path => {
    code.innerHTML = data.files[path].replace(/\n$/, "").split("\n")
      .map((l, i) => `<div class="ln"><span class="n">${i + 1}</span><span class="t">${paint(l) || " "}</span></div>`).join("");
    code.scrollTop = 0;

    const tab = document.createElement("button");
    tab.className = "tab"; tab.setAttribute("role", "tab"); tab.dataset.path = p; tab.textContent = short(p).split("/").pop();
    tab.addEventListener("click", () => open(p));
    tabs.appendChild(tab);
    const o = document.createElement("option"); o.value = p; o.textContent = short(p);
    pick.appendChild(o);
  });
  pick.addEventListener("change", () => open(pick.value));
  open(paths[0]);

  // Before / After
  const views = { before: document.getElementById("before"), after: document.getElementById("after") };
  const buttons = { before: document.getElementById("show-before"), after: document.getElementById("show-after") };
  const frame = document.getElementById("review");
  const show = (which, push = true) => {
    for (const k of ["before", "after"]) {
      views[k].hidden = k !== which;
      buttons[k].setAttribute("aria-pressed", String(k === which));
    }
    if (which === "after" && !frame.getAttribute("src")) frame.src = "review.html";  // load it only when asked
    if (push) history.replaceState(null, "", "#" + which);
  };
  buttons.before.addEventListener("click", () => show("before"));
  buttons.after.addEventListener("click", () => show("after"));
  document.getElementById("cta").addEventListener("click", () => show("after"));
  show(location.hash === "#after" ? "after" : "before", false);

  // The review follows the demo's theme.
  const syncTheme = () => {
    const doc = frame.contentDocument;
    if (doc && doc.documentElement) doc.documentElement.dataset.theme = document.documentElement.dataset.theme;
  };
  frame.addEventListener("load", syncTheme);
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
</body>
</html>
